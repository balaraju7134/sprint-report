<!-- Page Header -->
<header class="border-b border-slate-200 bg-white">
 <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">

  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">

   <!-- Page Title -->
   <div>
    <div class="flex items-center gap-2">

     <div
      class="flex h-9 w-9 items-center justify-center rounded-lg bg-slate-900 text-sm font-bold text-white shadow-sm">
      T
     </div>

     <h1 class="text-2xl font-bold tracking-tight text-slate-900">
      Teams
     </h1>

    </div>

    <p class="mt-2 text-sm text-slate-500">
     Upload sprint files, view reports, or clear existing data.
    </p>
   </div>


   <!-- Header Actions -->
   <div class="flex items-center gap-3">

    <!-- Team Count -->
    <div
     class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs font-medium text-slate-600">
     <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>

     {{ teamList.length }} teams
    </div>


    <!-- Export Reports -->
    <button type="button" (click)="goToExport()"
     class="inline-flex h-9 items-center gap-2 rounded-lg bg-indigo-600 px-3.5 text-xs font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">

     <!-- Download icon -->
     <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" />
     </svg>

     <span class="hidden sm:inline">
      Export Reports
     </span>

     <span class="sm:hidden">
      Export
     </span>

    </button>

   </div>

  </div>

 </div>
</header>

<!-- Team List -->
<main class="min-h-[calc(100vh-105px)] bg-slate-50">
 <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">

  <div class="flex flex-col gap-3">
   @for (team of teamList; track team.id) {

   <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm transition-all duration-200"
    [class.border-slate-300]="isOpen(team.id)" [class.shadow-md]="isOpen(team.id)">

    <!-- Team Header -->
    <div class="flex flex-col gap-4 px-4 py-4 sm:flex-row sm:items-center sm:justify-between sm:px-5"
     [class.bg-slate-50]="isOpen(team.id)">

     <!-- Team Information -->
     <div class="flex min-w-0 items-center gap-3">

      <!-- Avatar -->
      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-sm font-bold ring-4 ring-white"
       [ngClass]="team.avatarClass">
       {{ team.name | teamInitials }}
      </div>

      <!-- Name -->
      <div class="min-w-0">
       <div class="flex items-center gap-2">
        <h2 class="truncate text-sm font-semibold text-slate-900">
         {{ team.name }}
        </h2>

        @if (isOpen(team.id)) {
        <span
         class="rounded-full bg-emerald-50 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-emerald-700">
         Viewing
        </span>
        }
       </div>

       <p class="mt-0.5 text-xs text-slate-500">
        {{ team.theme }}
       </p>
      </div>
     </div>

     <!-- Team Actions -->
     <div class="flex items-center gap-2">

      <!-- Upload -->
      <button type="button"
       class="inline-flex h-9 items-center gap-2 rounded-lg bg-slate-900 px-3.5 text-xs font-semibold text-white shadow-sm transition hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2"
       (click)="uploadTeam(team.id)">
       <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path
         d="M9.25 13.5a.75.75 0 001.5 0V7.31l2.22 2.22a.75.75 0 001.06-1.06l-3.5-3.5a.75.75 0 00-1.06 0l-3.5 3.5a.75.75 0 101.06 1.06l2.22-2.22v6.19z" />
        <path
         d="M4.5 14.75a.75.75 0 00-1.5 0v1.5A1.75 1.75 0 004.75 18h10.5A1.75 1.75 0 0017 16.25v-1.5a.75.75 0 00-1.5 0v1.5a.25.25 0 01-.25.25H4.75a.25.25 0 01-.25-.25v-1.5z" />
       </svg>

       Upload
      </button>

      <!-- View -->
      <button type="button"
       class="inline-flex h-9 items-center gap-2 rounded-lg border border-slate-200 bg-white px-3.5 text-xs font-semibold text-slate-700 transition hover:bg-slate-50 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2"
       [attr.aria-expanded]="isOpen(team.id)" [attr.aria-controls]="'team-report-' + team.id"
       (click)="toggleTeam(team.id)">
       <svg class="h-4 w-4 transition-transform duration-200" [class.rotate-180]="isOpen(team.id)" viewBox="0 0 20 20"
        fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd"
         d="M5.23 7.21a.75.75 0 011.06.02L10 11.293l3.71-4.06a.75.75 0 111.12 1.0l-4.25 4.65a.75.75 0 01-1.08 0L5.21 8.29a.75.75 0 01.02-1.08z"
         clip-rule="evenodd" />
       </svg>

       {{ isOpen(team.id) ? 'Hide' : 'View' }}
      </button>

      <!-- Clear -->
      <button type="button"
       class="inline-flex h-9 items-center gap-2 rounded-lg border border-transparent px-3 text-xs font-semibold text-red-600 transition hover:bg-red-50 hover:text-red-700 focus:outline-none focus:ring-2 focus:ring-red-300 focus:ring-offset-2"
       (click)="clearTeam(team.id)">
       <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd"
         d="M8.5 2.5a1 1 0 00-1 1V4H5a.75.75 0 000 1.5h.5v9A2.5 2.5 0 008 17h4a2.5 2.5 0 002.5-2.5v-9h.5a.75.75 0 000-1.5h-2.5v-.5a1 1 0 00-1-1h-3zM7 5.5h6v9a1 1 0 01-1 1H8a1 1 0 01-1-1v-9z"
         clip-rule="evenodd" />
       </svg>

       Clear
      </button>
     </div>
    </div>

    <!-- Report -->
    @if (isOpen(team.id)) {
    <div [id]="'team-report-' + team.id" class="border-t border-slate-100 bg-slate-50/70 px-4 py-5 sm:px-5">
     <app-report-table [tableData]="tableData()" />
    </div>
    }

   </section>
   }
  </div>

 </div>
</main>
